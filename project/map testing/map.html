<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Example</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <link rel="stylesheet" href="styles.css"/>

</head>
    <body>
        <!-- Container for entire interactive dashboard-->
        <div class = "dashboard-container">

            <!-- Side-panel for filters and other interactions -->
            <div class = "left-side-panel">

            </div>

            <!-- center container for the map -->
            <div class = "map-container">
                <!-- actual map -->
                <div id = "map"></div>
            </div>

            <!-- Side-panel for interactions such as exporting map-->
            <div class = "right-side-panel">

            </div>

        </div>

        <script>
            // --- 1. MAP INITIALIZATION ---
            // Using a dark tile layer that fits the theme
            const map = L.map('map').setView([7.8731, 80.7718], 8);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 19,
                noWrap: true
            }).addTo(map);
        </script>
        <!-- 2. ADD GEOJSON LAYER -->
        <script src="mapLoader.js"></script>
        <script src="dataLoader.js"></script>
        <script type="module" src="mapColor.js"></script>
        
    </body> 
</html>
