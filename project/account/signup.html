<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherVanes</title>
    <link rel="stylesheet" href="../resources/styles.css">
</head>
<body>
    <!-- header -->
    <header>
        <div class="container header-content">
            <div class="logo">
                <!-- logo goes here? -->
                 WeatherVanes | Sign Up
            </div> 
            <nav>
                <ul>
                    <li>Already have an account? <a href="login.html">Log In</a></li>
                </ul>
            </nav>
        </div>
    </header>
    
    <!-- hero section -->
    <section class="hero">
        <div class="container hero-content">
            <h2>Welcome!</h2>
            <form id="signup">
                <input type="email" name="email" id="email" placeholder="Email Address" required>
                <br>
                <input type="fName" name="fName" id="fName" placeholder="First Name" required>
                <br>
                <input type="password" name="password" id="password" placeholder="Password" required>
                <br>
                <button type="submit">Sign Up</button>
            </form>
        </div>
    </section>

    <!-- footer -->
    <footer>
        <div class="container">
            <div class="footer-text">
                <p><a href="#github">Github</a> | <a href="#about">About</a></p>
            </div>
        </div>
    </footer>
</body>
</html>
